<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=960,H=720;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const clay=new THREE.MeshPhysicalMaterial({color:0xd9d6cf,roughness:0.38,metalness:0.0,clearcoat:0.6,clearcoatRoughness:0.25});
const glass=new THREE.MeshPhysicalMaterial({color:0x141518,roughness:0.08,metalness:0.2,clearcoat:1});
const dark=new THREE.MeshStandardMaterial({color:0x1a1b1e,roughness:0.7});
const tireM=new THREE.MeshStandardMaterial({color:0x1c1c1f,roughness:0.85});
const rimM=new THREE.MeshStandardMaterial({color:0x8d8f94,roughness:0.3,metalness:0.8});
const lightM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff6e0,emissiveIntensity:1.2});
const tailM=new THREE.MeshStandardMaterial({color:0x8a0d14,emissive:0xb0121c,emissiveIntensity:0.8});
const car=new THREE.Group(); scene.add(car);
function extrude(pts,depth,bevel,mat,z=0){const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(...p)));
 const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:6,curveSegments:24});
 g.translate(0,0,-depth/2+z); const m=new THREE.Mesh(g,mat); m.castShadow=true; car.add(m); return m;}
// body side profile with wheel arches
const body=new THREE.Shape();
body.moveTo(2.12,0.30); body.lineTo(1.80,0.30); body.absarc(1.36,0.36,0.44,0,Math.PI,false); body.lineTo(0.92,0.30);
body.lineTo(-0.92,0.30); body.absarc(-1.36,0.36,0.44,0,Math.PI,false); body.lineTo(-1.80,0.30); body.lineTo(-2.12,0.30);
body.quadraticCurveTo(-2.24,0.32,-2.22,0.62); body.quadraticCurveTo(-2.2,0.9,-2.0,0.96); body.lineTo(-1.45,0.99);
body.lineTo(1.0,0.95); body.quadraticCurveTo(1.7,0.9,2.05,0.76); body.quadraticCurveTo(2.24,0.66,2.22,0.46); body.quadraticCurveTo(2.2,0.31,2.12,0.30);
{const g=new THREE.ExtrudeGeometry(body,{depth:1.56,bevelEnabled:true,bevelThickness:0.16,bevelSize:0.1,bevelSegments:8,curveSegments:32}); g.translate(0,0,-0.78);
 const m=new THREE.Mesh(g,clay); m.castShadow=true; m.receiveShadow=true; car.add(m);}
// greenhouse (glass) + roof
const cab=new THREE.Shape(); cab.moveTo(-1.62,0.94); cab.quadraticCurveTo(-1.2,1.3,-0.9,1.38); cab.lineTo(0.3,1.40); cab.quadraticCurveTo(0.7,1.3,1.12,0.94); cab.lineTo(-1.62,0.94);
{const g=new THREE.ExtrudeGeometry(cab,{depth:1.22,bevelEnabled:true,bevelThickness:0.12,bevelSize:0.07,bevelSegments:6,curveSegments:24}); g.translate(0,0,-0.61); car.add(new THREE.Mesh(g,glass));}
const roof=new THREE.Shape(); roof.moveTo(-1.0,1.36); roof.quadraticCurveTo(-0.95,1.42,-0.85,1.43); roof.lineTo(0.28,1.45); roof.quadraticCurveTo(0.36,1.42,0.38,1.37); roof.lineTo(-1.0,1.36);
{const g=new THREE.ExtrudeGeometry(roof,{depth:1.26,bevelEnabled:true,bevelThickness:0.11,bevelSize:0.03,bevelSegments:6}); g.translate(0,0,-0.63); const m=new THREE.Mesh(g,clay); m.castShadow=true; car.add(m);}
// B-pillars
for(const z of [-0.66,0.66]){const b=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.42,0.05),clay); b.position.set(-0.28,1.16,z); car.add(b);}
// wheels
for(const x of [1.36,-1.36]) for(const z of [-0.8,0.8]){
 const w=new THREE.Group(); w.position.set(x,0.34,z);
 const tire=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.1,24,48),tireM); tire.scale.set(1,1,1.6); tire.castShadow=true; w.add(tire);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.2,40),rimM); rim.rotation.x=Math.PI/2; w.add(rim);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.22,40),dark); hub.rotation.x=Math.PI/2; w.add(hub);
 for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.34,0.23),rimM); s.rotation.z=i*Math.PI*2/5; w.add(s);}
 car.add(w);}
// lights, grille, plates
for(const z of [-0.62,0.62]){
 const h=new THREE.Mesh(new RoundedBoxGeometry(0.1,0.09,0.36,3,0.03),lightM); h.position.set(2.26,0.64,z); h.rotation.z=-0.55; car.add(h);
 const t=new THREE.Mesh(new RoundedBoxGeometry(0.08,0.09,0.4,3,0.03),tailM); t.position.set(-2.32,0.8,z); car.add(t);}
const grille=new THREE.Mesh(new RoundedBoxGeometry(0.06,0.16,0.9,3,0.04),dark); grille.position.set(2.33,0.45,0); car.add(grille);
const plateM=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:0.5});
const pf=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.11,0.52),plateM); pf.position.set(2.37,0.44,0); car.add(pf);
const pr=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.11,0.52),plateM); pr.position.set(-2.38,0.52,0); car.add(pr);
for(const z of [-0.98,0.98]){const m=new THREE.Mesh(new RoundedBoxGeometry(0.16,0.08,0.12,2,0.03),clay); m.position.set(0.95,1.02,z); car.add(m);}
// ground shadow
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:0.45})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(2,9,3); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4}); key.shadow.radius=8; scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff,0x222222,0.6));
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
window.shoot=(az)=>{const r=8.6,a=az*Math.PI/180; cam.position.set(r*Math.cos(a),1.5,r*Math.sin(a)); cam.lookAt(0,0.62,0); renderer.render(scene,cam); return renderer.domElement.toDataURL('image/png');};
window.ready=true;
</script></body></html>
